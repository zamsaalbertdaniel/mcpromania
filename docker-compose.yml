x-gateway-common: &gateway-common
  build:
    context: .
    dockerfile: apps/gateway/Dockerfile
  dns:
    - 1.1.1.1
    - 8.8.8.8
  env_file:
    - .env
  restart: unless-stopped

services:
  gateway-1:
    <<: *gateway-common
    ports:
      - '127.0.0.1:4000:4000'

  gateway-2:
    <<: *gateway-common
    ports:
      - '127.0.0.1:4001:4000'

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - '127.0.0.1:3001:3001'
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

volumes:
  uptime-kuma-data:
